
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINO RPG ADVENTURE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center}
header{padding:10px;background:#172b25}
h2{margin:5px;color:#f5d76e}
#stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;padding:10px}
#game{width:100%;max-width:850px;height:auto;background:#397b43;border:3px solid #d6bd72;touch-action:none}
button{background:#d6a83c;color:#171717;border:0;border-radius:8px;padding:12px;margin:4px;font-weight:bold}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
#message{min-height:35px;color:#ffe48b;padding:8px}
</style>
</head>
<body>
<header>
<h2>⚔ MINO RPG ADVENTURE</h2>
<div>Explore the world. Become a legend.</div>
</header>

<div id="stats">
<span id="hp">❤️ HP: 100</span>
<span id="level">⭐ Level: 1</span>
<span id="xp">XP: 0</span>
<span id="gold">💰 Gold: 0</span>
</div>

<canvas id="game" width="800" height="480"></canvas>

<div id="message">Welcome, MINO! Find the Elder in Greenvale.</div>

<div class="controls">
<button onclick="move(0,-1)">⬆</button>
<button onclick="move(-1,0)">⬅</button>
<button onclick="move(0,1)">⬇</button>
<button onclick="move(1,0)">➡</button>
<button onclick="attack()">⚔ ATTACK</button>
<button onclick="potion()">🧪 HEAL</button>
<button onclick="talk()">💬 TALK</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={x:400,y:240,hp:100,level:1,xp:0,gold:0};
let enemies=[
{x:180,y:160,hp:30,name:"Forest Slime",alive:true},
{x:600,y:300,hp:50,name:"Wild Goblin",alive:true},
{x:650,y:100,hp:100,name:"Dark Knight",alive:true}
];
let elder={x:400,y:100};
let quest=0;

function save(){
 localStorage.setItem("minoOpenSave",JSON.stringify({player,enemies,quest}));
}
function load(){
 let s=localStorage.getItem("minoOpenSave");
 if(s){
  try{
   let d=JSON.parse(s);
   player=d.player||player;
   enemies=d.enemies||enemies;
   quest=d.quest||0;
  }catch(e){}
 }
}
function message(t){
 document.getElementById("message").textContent=t;
}
function update(){
 document.getElementById("hp").textContent="❤️ HP: "+player.hp;
 document.getElementById("level").textContent="⭐ Level: "+player.level;
 document.getElementById("xp").textContent="XP: "+player.xp;
 document.getElementById("gold").textContent="💰 Gold: "+player.gold;
 save();
}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w,h);
}
function character(x,y,color,label){
 rect(x-10,y-10,20,25,color);
 rect(x-7,y-20,14,12,"#f1c49b");
 ctx.fillStyle="white";
 ctx.font="12px Arial";
 ctx.textAlign="center";
 ctx.fillText(label,x,y-26);
}
function draw(){
 rect(0,0,800,480,"#4d914e");

 // Grass
 for(let i=0;i<100;i++){
  let x=(i*97)%800,y=(i*53)%480;
  rect(x,y,3,3,"#70a95d");
 }

 // River and bridge
 rect(0,350,800,55,"#277fc0");
 rect(350,345,100,65,"#a98252");
 for(let x=0;x<800;x+=40)rect(x,360,20,4,"#6ab0dd");

 // Village houses
 for(let h of [{x:80,y:70},{x:650,y:370},{x:100,y:390}]){
  rect(h.x,h.y,70,55,"#d6c08b");
  rect(h.x-8,h.y-15,86,20,"#8c4435");
  rect(h.x+27,h.y+28,16,27,"#553d2b");
 }

 // Forest
 for(let i=0;i<12;i++){
  let x=500+(i%4)*65,y=30+Math.floor(i/4)*65;
  rect(x-5,y,12,30,"#62452e");
  ctx.fillStyle="#174d32";
  ctx.beginPath();
  ctx.arc(x,y,25,0,Math.PI*2);
  ctx.fill();
 }

 // Elder
 character(elder.x,elder.y,"#e7e0c5","ELDER");

 // Enemies
 enemies.forEach(e=>{
  if(e.alive){
   character(e.x,e.y,"#8d3030",e.name);
   ctx.fillStyle="red";
   ctx.fillRect(e.x-15,e.y+14,30,4);
   ctx.fillStyle="#6cff66";
   ctx.fillRect(e.x-15,e.y+14,30*(e.hp/(e.name==="Dark Knight"?100:e.name==="Wild Goblin"?50:30)),4);
  }
 });

 // Player
 character(player.x,player.y,"#2867db","MINO");
 ctx.fillStyle="white";
 ctx.font="16px Arial";
 ctx.textAlign="left";
 ctx.fillText("GREENVALE",15,25);
 requestAnimationFrame(draw);
}
function move(dx,dy){
 if(player.hp<=0)return;
 player.x=Math.max(20,Math.min(780,player.x+dx*22));
 player.y=Math.max(25,Math.min(450,player.y+dy*22));
 update();
}
function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function attack(){
 if(player.hp<=0)return;
 let target=enemies.find(e=>e.alive&&distance(player,e)<65);
 if(!target){
  message("No enemy nearby! Move closer.");
  return;
 }
 let damage=20+player.level*3;
 target.hp-=damage;
 message("You attacked "+target.name+" for "+damage+" damage!");
 if(target.hp<=0){
  target.alive=false;
  player.xp+=25;
  player.gold+=10;
  message(target.name+" defeated! +25 XP and +10 Gold.");
  if(player.xp>=100){
   player.xp-=100;
   player.level++;
   player.hp=100;
   message("LEVEL UP! You are now level "+player.level+"!");
  }
 }
 update();
}
function potion(){
 if(player.hp<=0)return;
 if(player.gold<5){
  message("You need 5 Gold for a healing potion.");
  return;
 }
 if(player.hp>=100){
  message("Your health is already full.");
  return;
 }
 player.gold-=5;
 player.hp=Math.min(100,player.hp+40);
 message("Potion used! Health restored.");
 update();
}
function talk(){
 if(distance(player,elder)<65){
  if(quest===0){
   quest=1;
   message("Elder: Please defeat the Forest Slime!");
  }else if(quest===1){
   if(!enemies[0].alive){
    quest=2;
    message("Elder: Excellent! Now defeat the Wild Goblin.");
   }else{
    message("Elder: The Forest Slime is still alive!");
   }
  }else if(quest===2){
   if(!enemies[1].alive){
    quest=3;
    message("Elder: The Dark Knight threatens our kingdom. Defeat him!");
   }else{
    message("Elder: Defeat the Wild Goblin first!");
   }
  }else if(quest===3){
   if(!enemies[2].alive){
    quest=4;
    message("Elder: You saved the kingdom! You are a true hero!");
   }else{
    message("Elder: Defeat the Dark Knight!");
   }
  }else{
   message("Elder: Welcome back, hero!");
  }
 }else{
  message("Move closer to the Elder to talk.");
 }
 update();
}
document.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w")move(0,-1);
 if(k==="arrowdown"||k==="s")move(0,1);
 if(k==="arrowleft"||k==="a")move(-1,0);
 if(k==="arrowright"||k==="d")move(1,0);
 if(k===" ")attack();
});
load();
update();
draw();
</script>
</body>
</html>
